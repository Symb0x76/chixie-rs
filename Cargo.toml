[package]
name = "chixie-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.23.1"
cbc = "0.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
hmac = "0.12"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.10"
thiserror = "2.0.21"
