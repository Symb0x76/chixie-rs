[workspace]
resolver = "3"
members = ["crates/chixie-core", "crates/chixie-cli", "crates/chixie-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
chixie-core = { path = "crates/chixie-core" }
aes = "0.8"
base64 = "0.23.1"
cbc = "0.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
hmac = "0.12"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.10"
thiserror = "2.0.21"
# UI: gpui-kit bundles gpui (gpui-pre =0.3.11), gpui_platform and gpui-component 0.9.0 as
# one coherent pin. Exact version only; bump deliberately and re-run the gpui identity check
# (`cargo tree -p chixie-gui -i gpui-pre` must show exactly one instance).
gpui-kit = "=0.9.0"
async-channel = "2"
toml = "1"
directories = "6"
keyring = "4.2"
# Font preview PNGs → ink masks. Same crate instance gpui already pulls in.
image = { version = "0.25.10", default-features = false, features = ["png"] }
